name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

# One Linux job: nothing here is platform specific. The constraints pin the
# plotting stack, because the committed SVGs are compared byte for byte.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -c constraints.txt -e .
      - run: python -m emref check
