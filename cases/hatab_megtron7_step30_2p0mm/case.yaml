notes: The calibration uses all eight 50 Ohm lines of the board, the source paper used six of them. Trace
  widths are 94 um and 209 um, each +-15 um from cross-sections; along the line the width varies within
  that tolerance. The S-parameters are normalised to the characteristic impedance of the 94 um line, so
  a solver result has to be normalised the same way (de-embedded wave port on the 50 Ohm line, or renormalised
  to its computed Z0). The calibrated data are reciprocal to 0.003 below 5 GHz, but |S12 - S21| grows
  to about 0.1 at 150 GHz with |S12/S21| = 1, a phase difference. The source's own multiline TRL code
  gives the identical result, so this is a property of the measurement (probe contact repeatability between
  standards and DUT is the likely cause) and a measure of its uncertainty at the top of the band.
