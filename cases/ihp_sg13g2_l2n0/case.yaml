open_questions:
- Which ground reference do the two single-ended ports have after the GSGSG de-embedding? The differential
  quantities (Zdiff) do not depend on it.
- 'Substrate thickness and backside condition of the measured die: the IHP model uses 280 um with PEC
  boundaries, the L6n2 study 200 um with open boundaries.'
- The de-embedding standards and the pad frame GDS.
notes: N = 2, w = 12 um, s = 3 um, inner diameter 200 um, winding on TopMetal2 with TopMetal1 feeds and
  underpass. The IHP guide reports a measured SRF of 25.5 GHz and peak Q 23.5 at 9 GHz, against 22.7 GHz
  in its openEMS model, and attributes the gap to the conformal passivation between the turns, which its
  planar model did not have and the stack here does. The two dies show the die-to-die spread.
