open_questions:
- The data include the SMA end-launch connectors (SMA-KHD23), which are not part of the layout. A connector
  model or a measurement of the connector pair (thru) is needed to move the reference plane onto the board.
- Drill diameters are read from the drill guide crosses ([0.305, 2.1] mm); the source has no NC drill
  file. Whether the large holes are plated is not stated.
- Actual loss tangent of the RO4350B-class laminate and the true layer thicknesses of the hybrid stack.
notes: Ports are placed where the signal trace meets the board edge, as edge ports to the ground plane
  under the laminate. The ground pads beside the trace at both edges are the launch pads of the connectors.
