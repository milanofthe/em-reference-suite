notes: 'From FAB_DOC.md of the source: RO4350B for the RF layer (Dk 3.66, Df 0.0037, 0.254 mm), FR-4 below,
  1 oz ED copper, OSP finish, no solder mask over the circuits. The boards were built on a Chinese RO4350B
  variant with the same Dk and a lower, unstated Df, so tand is an upper bound. The layer thicknesses
  are described by the source as approximated to a 0.8 mm board. Plated holes are modelled as solid copper
  cylinders from the ground plane to the top copper.'
