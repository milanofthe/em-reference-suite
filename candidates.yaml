# Public sources with measured planar structures that are not (yet) cases.
#
# Each entry says what the source provides and the one thing that keeps it out of
# the corpus. Rendered into the README by `python -m emref build`.

- name: OnMicro on-wafer interlaboratory comparison, HR-Si CPW, 10 GHz to 1.1 THz
  url: https://doi.org/10.5281/zenodo.23042690
  doi: 10.1109/TTHZ.2025.3537461
  license: CC-BY-4.0
  domain: onwafer
  has: Measured S-parameters of seven laboratories in six bands (mismatched lines, attenuator, filter, load, open), multiline TRL at the probe tips, process description (275 um HR-Si, 50 nm oxide, Ti/Au 485 nm, Ti thin-film resistors).
  missing: Layout of the comparison devices. The paper gives the dimensions of the thru only.
  blocker: geometry

- name: METAS / NPL CPW line on GGB CS-5 alumina, 1 to 65 GHz
  url: https://doi.org/10.5281/zenodo.22643057
  license: CC-BY-4.0
  domain: onwafer
  has: SOLT-calibrated measurement of a 6.55 mm CPW line with a cross-section table including k=2 uncertainties (widths, gap, metal thickness, roughness, conductivity, er, tand).
  missing: Probe pad geometry (the reference plane is at the probe tips) and the substrate thickness. Data are in METAS VNA Tools format.
  blocker: geometry

- name: NPL / MPI / Anritsu attenuators and loads to 220 GHz
  url: https://doi.org/10.5281/zenodo.22658069
  license: CC-BY-4.0
  domain: onwafer
  has: Multiline-TRL-corrected S-parameters of three attenuators and loads on an MPI TCS-050-100-W substrate.
  missing: Any layout or dimensions, and the thin-film resistor data.
  blocker: geometry

- name: Hatab, FormFactor ISS 104-783 CPW lines, raw waves 1 to 150 GHz
  url: https://github.com/ZiadHatab/uncertainty-multiline-trl-calibration
  license: BSD-3-Clause
  domain: onwafer
  has: Raw wave parameters of five lines, open and thru with 500 sweeps each; cross-section estimates in the code (w 49.1, s 25.5, wg 273.3, t 4.9 um, alumina).
  missing: The structures are calibration standards, so the benchmark quantity is the propagation constant, which the suite does not carry yet. Substrate thickness not given.
  blocker: quantity

- name: Hatab, MPI ISS CPW lines to 150 GHz
  url: https://github.com/ZiadHatab/uncertainty-multiline-trl-calibration
  license: BSD-3-Clause
  domain: onwafer
  has: Raw Touchstone of six lines, a short and the switch terms.
  missing: Cross-section and substrate of the MPI ISS.
  blocker: geometry

- name: Hatab, Tachyon 100G microstrip kit, 1 to 50 GHz
  url: https://github.com/ZiadHatab/srm-calibration
  license: BSD-3-Clause
  domain: pcb
  has: Probe measurements with on-board multiline TRL standards.
  missing: Layout of the stepped-line DUT, numeric er and tand, roughness.
  blocker: geometry

- name: TU Graz probe-measured PCB kits to 150 GHz (stripline on Tachyon 100G, microstrip on Astra MT77 with surface finishes, GCPW on Megtron 7 with a Ka-band metasurface filter)
  url: https://arxiv.org/abs/2512.18641
  license: unknown
  domain: pcb
  has: Described in the paper; bare copper, multiline TRL with GSG probes.
  missing: The data and layouts are not published.
  blocker: not public

- name: IEEE P370 de-embedding plug-and-play kit (Signal Microwave)
  url: https://opensource.ieee.org/elec-char/ieee-370
  license: BSD-3-Clause (repository); the board DXF carries "Copyright 2018 Signal Microwave"
  domain: pcb
  has: DXF of nine coupons, a 4-layer RO4003 stackup in the drawing notes, six coax-calibrated measurements to 60 GHz.
  missing: A clear license for the board drawings, the 2x-thru measurement that would move the reference plane onto the board, and Dk/Df of the laminates.
  blocker: license

- name: Ammann, multilayer SMA to microstrip transition on Aisler 6-layer
  url: https://github.com/toammann/Multilayer_SMA2Microstrip
  license: CC0-1.0
  domain: pcb
  has: KiCad and per-layer DXF, the full 6-layer stack with a Djordjevic-Sarkar model, a measured back-to-back board to 26.5 GHz with P370-separated halves, and a 3D model of the connector built from a cross-section.
  missing: The case is a coax-to-planar transition with edge plating; it needs 3D geometry beside the GDS, which the suite does not support yet.
  blocker: 3d

- name: Ammann, comb line for multi-term Debye experiments
  url: https://github.com/toammann/OpenEMS_MultiTermDebyeExperiments
  license: none
  domain: pcb
  has: A 2x-thru de-embedded measurement of a 23.5 mm microstrip line on the Aisler stack.
  missing: A license, and the layout of the long board.
  blocker: license

- name: scikit-rf MSL and CPWG example lines on milled FR-4
  url: https://github.com/scikit-rf/scikit-rf/tree/master/doc/source/examples/networktheory
  license: BSD-3-Clause
  domain: pcb
  has: 100 and 200 mm microstrip and grounded CPW lines with dimension tables, 1 MHz to 10 GHz.
  missing: SMA connectors are in the data, er and tand are fitted to the same lines, and the via wall positions of the CPWG are not given.
  blocker: geometry

- name: Antmicro signal integrity test board (gerber2ems examples)
  url: https://github.com/antmicro/gerber2ems
  license: Apache-2.0
  domain: pcb
  has: Gerber files and a stackup file; measured S11 of meander and stub examples and a filter, 0.1 to 6 GHz.
  missing: SMA connectors are in the data, mostly one-port, generic FR-4 values (4.18 / 0.02).
  blocker: connector

- name: IHP SG13G2 RF pad dummies (module S439S)
  url: https://github.com/IHP-GmbH/IHP-Open-PDK/tree/main/ihp-sg13g2/libs.doc/meas
  license: Apache-2.0
  domain: onchip
  has: Measured open and short pad dummies to 65 GHz (IC-CAP MDM) and the GDS of the test module.
  missing: The map from measured device to cell in the module GDS, and the calibration method.
  blocker: geometry

- name: IHP SG13CMOS5L MoM capacitors (TEST9203)
  url: https://github.com/KrzysztofHerman/IHP__TEST9203
  license: Apache-2.0
  domain: onchip
  has: GDS of 28 MoM capacitors with GSG pads and open/short/thru de-embedding structures.
  missing: Measurements, not published yet.
  blocker: not public

- name: Muehlhaus, TopMetal2 over Metal1 microstrip lines on SG13G2 (880 and 2580 um)
  url: https://github.com/VolkerMuehlhaus/gds2palace_ihp_sg13g2
  license: GPL-3.0-or-later
  domain: onchip
  has: De-embedded measurement shown as plots in the user guide.
  missing: The data files and the GDS of the measured structures.
  blocker: not public

- name: AcubeSAT S-band U-slot patch antenna, 2.4 GHz
  url: https://gitlab.com/acubesat/comms/antennas/s-band-antenna-sat
  license: GPL-3.0
  domain: pcb
  has: KiCad layout, Gerbers and the CST project; raw S21 sweeps of a horn-substitution gain measurement (2 to 3 GHz), pattern cuts and axial-ratio scans from the AUTh chamber.
  missing: A measured S11 (the S11 file in the repository is a CST export) and the stack of the three FR-4 sheets laminated with epoxy (sheet and bond thicknesses, permittivity). KiCad and CST differ in slot width and feed offset, so the etched geometry is not certain.
  blocker: data

- name: Loughborough circular patch with arc projection, 2.4 GHz
  url: https://doi.org/10.17028/rd.lboro.3471827.v1
  doi: 10.1109/LAWP.2016.2586749
  license: CC-BY-4.0
  domain: pcb
  has: CST projects of the flat and the arc-loaded patch, chamber summary sheets (S11, Zin, gain, efficiency, patterns) of both prototypes, dimension table in the paper.
  missing: Consistent data for the flat patch (its wideband sheet shows VSWR near 50, the boresight gain sits 30 dB below the peak, E-theta and E-phi are identical), the measurement frame, and the feed position of the flat patch, whose CST parameters disagree with the paper. The arc patch is hand-built with copper tape and a 3D-printed part.
  blocker: data

- name: F4HDG 23 cm stepped-impedance low-pass filter (Qucs-RFlayout test case)
  url: https://github.com/thomaslepoix/Qucs-RFlayout/tree/master/test/lpf
  license: GPL-3.0 (Qucs-RFlayout copy); the upstream project has no license
  domain: pcb
  has: Qucs schematic with all section dimensions, the as-built KiCad layout upstream (framagit f4hdg/Transverter_23cm), an R&S ZNB8 measurement 100 kHz to 5 GHz.
  missing: A license from the designer, the laminate (er 4.2 and tand 0.035 are design values) and fab, the connector type and the calibration plane.
  blocker: license

- name: Qucs-RFlayout stub filter test case
  url: https://github.com/thomaslepoix/Qucs-RFlayout/tree/master/test/stub
  license: GPL-3.0
  domain: pcb
  has: Qucs schematic with dimensions and substrate parameters, an R&S ZVRE measurement 1 to 3 GHz.
  missing: Designer, fab, connectors and calibration are not documented; the layout exists only as the schematic.
  blocker: connector

- name: Lime Microsystems Vivaldi antenna, RO4350B
  url: https://github.com/myriadrf/vivaldi-antenna
  license: CC-BY-3.0
  domain: pcb
  has: KiCad board and Gerbers on 0.5 mm RO4350B.
  missing: Measured data as files; S11 is a raster figure, gain a table from a two-antenna setup at 1 m.
  blocker: data

- name: Open Source RIS, 5 GHz reconfigurable surface
  url: https://github.com/mheinri/OpenSourceRIS
  license: MIT
  domain: pcb
  has: Gerbers on a documented JLC04161H-7628 stack with measured er 4.8.
  missing: Measured reflection as data files (only README images), and models of the SPDT switches in every cell.
  blocker: data

- name: Oulu D-band reflective metasurface, 140 GHz
  url: https://zenodo.org/records/19686841
  license: CC-BY-4.0
  domain: pcb
  has: Measured bistatic reflection (.mat, .xlsx) on 100 um Megtron 7.
  missing: The per-cell patch lengths, which are only in the IEEE AWPL letter, and a layout.
  blocker: geometry

- name: IEEE EPS packaging benchmark suite
  url: https://packaging-benchmarks.org
  license: CC-BY-ND-4.0, registration required
  domain: package
  has: Six problems (PCB laminate, mm-wave substrate filter and others) with geometry, stack and Touchstone measurements from up to three laboratories.
  missing: Permission to convert and redistribute; the no-derivatives terms forbid the GDS and stack conversion the suite needs.
  blocker: license

- name: Studio-Fug yapnr, OSH Park 4-layer multiline TRL kit with stubs, rings and dividers
  url: https://github.com/Studio-Fug/yapnr
  license: AGPL-3.0
  domain: pcb
  has: KiCad files and pre-registered predictions on OSH Park FR408-HR.
  missing: The boards have not been ordered or measured yet.
  blocker: not public

- name: Koch fractal monopole with full-precision geometry
  url: https://zenodo.org/records/23088565
  license: unknown
  domain: pcb
  has: Announced measured S11, gain and patterns with the exact geometry.
  missing: The files are restricted until publication.
  blocker: not public

- name: NIST broadside-coupled CPW contactless interconnects on fused silica, to 325 GHz
  url: https://data.nist.gov/od/id/mds2-2777
  doi: 10.18434/mds2-2777
  license: NIST-PD
  domain: onwafer
  has: Back-to-back structures with 125, 250 and 500 um coupling (mds2-2777) and the de-embedded single interconnect (mds2-3079), multiline TRL to 325 GHz; cross-section of every region and the Au / SU-8 / Au stack in the papers.
  missing: Phase. The spreadsheets carry the magnitudes in dB only, as plotted. Also the substrate thickness, the plan view of the region transitions, and SU-8 data above 110 GHz.
  blocker: data

- name: NIST Calnet sapphire calibration kit, 10 MHz to 110 GHz
  url: https://data.nist.gov/od/id/mds2-3404
  doi: 10.18434/mds2-3404
  license: NIST-PD
  domain: onwafer
  has: Complex S2P files of 14 standards (nine lines, series resistor and capacitor, reflects), effective permittivity and Z0, according to the record.
  missing: Any layout, dimensions or substrate data in the record; the files themselves could not be downloaded from the NIST file server.
  blocker: geometry

- name: OreSat microstrip width boards (0.34 to 0.40 mm) on OSH Park 4-layer
  url: https://github.com/oresat/oresat-c3-rf
  license: MIT
  domain: pcb
  has: EAGLE boards of four 50 mm lines with via fences, the 2019 OSH Park stack in the layer setup, E5071C SOLT measurements 0.2 to 20 GHz.
  missing: The end-launch SMA connectors are in the data and dominate above a few GHz (singular values up to 1.09 below 6 GHz and 1.2 above 8 GHz); the ground pours exist only as outlines, the laminate (FR408 or FR408-HR) is uncertain.
  blocker: connector

- name: University of Oviedo 24 GHz grid array antenna on aluminium-clad polypropylene
  url: https://zenodo.org/records/19335064
  doi: 10.5281/zenodo.19335064
  license: CC-BY-4.0
  domain: pcb
  has: Measured S11 (15 to 32 GHz, complex) and co- and cross-polar pattern cuts at seven frequencies, with and without radomes; the main dimensions in the papers.
  missing: The layout (dimension convention, stub length and feed position only from raster drawings and photos; Gerber files not published), consistent coaxial feed dimensions, and the horn gain table for absolute gain.
  blocker: geometry
